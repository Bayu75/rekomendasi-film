<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MovieMatch{% endblock %}</title>
  <meta name="description" content="MovieMatch – sistem rekomendasi film berbasis kemiripan konten.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap">
  
  <script>
    // Menerapkan tema tersimpan sebelum halaman tampil agar tidak berkedip
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light');
    }
  </script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-background flex flex-col">
  {% block navbar %}{% include 'partials/navbar.html' %}{% endblock %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% block footer %}{% include 'partials/footer.html' %}{% endblock %}

  <script src="{{ url_for('static', filename='js/poster.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/navbar.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/search_bar.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
